<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Exercise 1</title>
    <style>
        .dataset {
            stroke-width: 3px;
            fill: none;
        }
        text {
            font-family: sans-serif;
            font-size: 12px;
        }
    </style>
</head>
<body>
<h1>Using timers</h1>
<p>Five seconds after the page loads, labels appear at the end of each line</p>
<script type="module">
    import * as d3 from "https://cdn.jsdelivr.net/npm/d3@7/+esm";
    import * as utils from "../../js/chart-utils.js";

    // See EXERCISE at the end of this file.

    const dim = { width: 800, height: 400, margin: 50 };
    const scale = {
        x: d3.scaleLinear().range([dim.margin, dim.width - dim.margin]),
        y: d3.scaleLinear().range([dim.height - dim.margin, dim.margin])
    }
    const container = d3.select("body")
                        .append("svg")
                        .attr("height", dim.height)
                        .attr("width", dim.width);

    // Change this to add more data series
    const series = 3;

    // The data is an array of series, each with 5 points and random y-values
    const datasets = [];

    // There are 5 x-values in each series
    const steps = d3.range(0,21,5); // [0,5,10,15,20]

    // The y-values are random numbers between 0 and 50
    // In this example, each data series is an array of objects
    for (let i = 0; i < series; i++) {
        datasets.push(steps.map( (d,i) => ({step: d, value: d3.randomInt(50)(), index: i})));
    }

    // Scales -
    scale.x.domain(d3.extent(datasets.flat(), d => d.step));
    scale.y.domain(d3.extent(datasets.flat(), d => d.value));

    // Generates a color for each data series
    const color = d3.scaleOrdinal(d3.schemeCategory10)
                    .domain(d3.range(datasets.length));

    // line function for all lines
    const line = d3.line()
                   .x(d => scale.x(d.step))
                   .y(d => scale.y(d.value));


    // Bind the data array to a selection of <path> elements. Each <path> will receive a data series.
    container.selectAll("path.dataset")
       .data(datasets)
         .join("path")
           .attr("class", "dataset")
           .attr("d", line)
           .style("stroke", (d, i) => color(i));

    // Draw the axes (we are using a utility function from chart-utils.js)
    utils.cartesianAxes()
         .container(container)
         .xScale(scale.x)
         .yScale(scale.y)()

    // EXERCISE: Use a timer to only show these labels after 5 seconds
    container.append("g")
             .selectAll("text.label")
               .data(datasets)
                 .join("text").attr("class", "label")
                   .attr("x", d => scale.x(d[d.length - 1].step) + 5)
                   .attr("y", d => scale.y(d[d.length - 1].value))
                   .text((d,i) => `Series ${i + 1}`);

</script>
</body>
</html>
