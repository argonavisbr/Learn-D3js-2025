<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Exercise 3</title>
</head>
<body>
<h1>Exercise 3: draw random circles at native frame rate, after waiting 3 seconds</h1>
<script type="module">
  import * as d3 from "https://cdn.jsdelivr.net/npm/d3@7/+esm";

  // EXERCISE: Create a timeout that waits three seconds and calls drawCircle() repeatedly,
  // using the native frame rate to render a circle.

  const dim = {width: 800, height: 600};
  const svg = d3.select("body").append("svg").attr("width", dim.width).attr("height", dim.height);

  // ADD CODE HERE
  d3.timer(drawCircle, 3000); // Call drawCircle at default frame rate after a 3-second delay

  function drawCircle() {
    const x = Math.random() * dim.width;
    const y = Math.random() * dim.height;
    const radius = Math.random() * 50 + 10; // Random radius between 10 and 60
    const color = d3.interpolateRainbow(Math.random()); // Random color

    svg.append("circle")
      .attr("cx", x)
      .attr("cy", y)
      .attr("r", radius)
      .attr("fill", color);
  }

</script>
</body>
</html>
