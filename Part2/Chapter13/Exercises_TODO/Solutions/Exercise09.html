<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Global temperatures 1880 to 2023 - spiral</title>
    <style>
        path.months {
            stroke-width: 1px;
            fill: none;
            opacity: .75;
        }
        h1, p, text {
            font-family: sans-serif;
            color: #ddd;
        }
        a:link, a:visited {
            color: #9ab;
        }
        p {font-size: 10px}
        h1 {font-size: 16px}
        text.year {
            font-size: 15px;
            font-weight: bold;
            text-anchor: start;
            alignment-baseline: middle;
            pointer-events: none;
        }
        .chart {
            pointer-events: none;
        }
        svg, body {
            background-color: #234;
        }
        .radial .domain, .radial circle  {
            stroke: #567;
        }
        .radial text {
            fill: #abc;
        }
        .radial .grid {
            stroke: #567;
        }
        .radial .grid.zero {
            stroke: #d66;
        }
    </style>
</head>
<body>
<h1>Global temperatures from <span id="first-year">1880</span> to <span id="last-year">2023</span></h1>
<p>Source: <a href="https://data.giss.nasa.gov/gistemp/">NASA Godard Institute for Space Studies</a></p>
<script type="module">
    import * as d3 from "https://cdn.jsdelivr.net/npm/d3@7/+esm";
    import * as utils from "../../js/chart-utils.js";

    // EXERCISE: Implement the animateLines() function and the changeText() function.
    // See comments in the code below for instructions.


    // Global temperatures 1880 to 2025 (Source: https://data.giss.nasa.gov/gistemp/)
    const file = "../../data/GLB.Ts.1880.2025.csv";

    // Load, parse and prepare the data
    const csv = await d3.csv(file, d3.autoType)
    //console.log("csv", csv); // inspect to see the format of the parsed data

    // Get months
    const months = csv.columns.splice(1);
    //console.log('months', months);    // inspect to see if months are correct

    // Convert data to a standard format [[year, [['Jan', t1], ['Feb, t2], ..., ['Dec',t12]]], ...]
    const dataByYear = csv.map(obj => [obj.Year, months.map(d => [d, obj[d]])])
    //console.log('dataByYear', dataByYear);  // inspect to see if conversion is correct

    // add the value from the next line to the end of each year's data for continuity
    dataByYear.forEach((d,i) => d[1].push(
        dataByYear[i+1]   // if there is a next line
            ? dataByYear[i+1][1][0]     // add the first value of the next line
            : d[1][d[1].length-1]));    // otherwise repeat the last value of the current line

    // A color scale that starts with cold colors and ends with hot colors
    const color = d3.scaleSequential(d3.interpolateTurbo);

    // True, when the animation is running, false when it is finished
    let animating = true;
    const lastYear = dataByYear[dataByYear.length-1][0];

    plot(dataByYear, months);

    // This function renders the chart, including the lines, axes, and interactive features.
    function plot(data, months) {
        const height = 600, width = 600, margin = 30;

        const scaleAngle = d3.scaleLinear()
                             .domain([0, months.length])
                             .range([0, 2*Math.PI]);

        const series = data.map( d => d[1].map(v => v[1]) ); // array with arrays of values
        //console.log('series', series)

        const values = d3.merge(series); // flat array with all values
        //console.log('values', values)

        const scaleRadius = d3.scaleLinear()
                              .domain([d3.min(values) - .2, d3.max(values) + .1])
                              .range([0, width/2 - margin]);

        const mean = series.map(d => d3.mean(d));
        //console.log('mean', mean)

        // Set the color scale domain based on the mean temperature of each year
        color.domain(d3.extent(mean));

        // Line functions
        const line = d3.lineRadial()
                       .angle((d,i) => scaleAngle(i))
                       .radius(d => scaleRadius(d[1]))
                       .defined(d => d[1] && !isNaN(d[1]))  // ignores null and not-a-number
                     //.curve(d3.curveBasis);

        // Render chart
        const svg = d3.select("body").append("svg")
                                     .attr("width", width)
                                     .attr("height", height);
        // Chart container - move to center of viewport
        const chart = svg.append("g").attr("transform", `translate(${width/2},${height/2})`);

        d3.select("#last-year").text(data[data.length-1][0]);
        d3.select("#first-year").text(data[0][0]);

        // A placeholder for the year label, which will be updated as each line is drawn in the animation.
        svg.append("text")
            .attr("class", "yearLabel")
            .attr("x", width - margin - 50)
            .attr("y", margin)
            .style("fill", "black")
            .style("font-weight", "bold")
            .style("font-size", "36px")
            .text("");

        // Render temperature lines in chart container
        // This renders the static chart
        chart.selectAll("g.line")
             .data(data)
               .join("g")
                 .attr("class", "line")
                 .append("path")
                    .datum(d => d)
                        .attr("class", "months")
                        .attr("d", d => line(d[1]))
                        .style("stroke", d => color(d3.mean(d[1].map(v => v[1]))));

        // This function animates the rendering of the lines using stroke-dasharray and stroke-dashoffset.
        // If you comment it, a static chart will be displayed instead of an animated one.
        animateLines(chart);

        // Draw radial axes in chart container
        utils.radialAxes().container(chart)
            .aScale(scaleAngle)
            .rScale(scaleRadius)
            .angularData(months)
            .numTicks(10)
            .useGrid(true)
            .backdropColor(svg.style("background-color"))
            .backdropOpacity(0.8)();
    }

    // EXERCISE: implement the animation using stroke-dasharray and stroke-dashoffset to draw the lines one by one,
    // and change the year label as each line is drawn. Since the code is initially empty, the chart will
    // initially be displayed statically without any animation.

    // 1) Implement the code to animate the lines using stroke-dasharray and stroke-dashoffset.
    //    Use a transition with a delay based on the index of the line to draw them one by one.
    //    Call the changeText function at the end of each transition to update the year label.
    //    Add transitions to change the stroke-width and opacity after the line is drawn.
    //    Draw the line initially with a stroke-width of 6 and opacity of 1,
    //    then transition to a stroke-width of 3 and opacity of 0.75, so that the current
    //    line is highlighted while the previous lines are faded.

    function animateLines(chart) {
        const lineDur = 100; // the time in ms it takes to draw each line

        chart.selectAll("g.line path")
            .style("stroke-dasharray", function () {
                return this.getTotalLength()
            })
            .style("stroke-dashoffset", function () {
                return this.getTotalLength()
            })
            .style("stroke-width", 6)
            .style("opacity", 1)
            .transition().delay((d, i) => (lineDur + i) * i).duration((d, i) => lineDur + i).ease(d3.easeLinear)
                .on("end", changeText)
                .style("stroke-dashoffset", 0)
                .transition().duration(1000) // no delay, same ease
                    .style("stroke-width", 3)
                    .transition().duration(1000) // no delay, same ease
                        .style("stroke-width", (d, i, n) => i >= n.length - 1 ? 6 : i >= n.length - 2 ? 3 : 1)
                        .style("opacity", .75);
    }

    // 2) Implement the code to change the year label as each line is drawn (changeText() function).
    //    Use the mean temperature of the year to set the color of the year label.
    //    This function should be called at the end of each transition to update the year label with the
    //    current year and its corresponding color.
    function changeText(d) {
        // Check if the current year is the last year, and if so, call activateMouseover() to enable mouseover interactions.
        if(d[0] === lastYear) {
            animating = false;
            activateMouseover();
        }
        // Update the year label with the current year and its corresponding color based on the mean temperature of the year.
        d3.select(".yearLabel")
            .style("fill", color(d3.mean(d[1].map(v => v[1]))))
            .text(d[0])
    }

    // After animation finishes, the user can obtain context information via mouseover.
    function activateMouseover() {
        // Show year and thicken the line on mouse over
        d3.selectAll("g.line")
            .on("mouseover", function (event, d) {
                d3.select(".yearLabel").text(d[0]).style("fill", color(d3.mean(d[1].map(v => v[1]))));
                const [x, y] = d3.pointer(event);
                const selectedLine = d3.select(event.target);

                d3.select("svg").append("text")     // display the year near the pointer
                    .attr("class", "year")
                    .attr("x", x + 10)
                    .attr("y", y + 10)
                    .text(d[0]);

                // make all other lines fainter
                d3.selectAll("g.line path")
                    .style("opacity", .35);

                // make current line thicker and opaque
                selectedLine.style("stroke-width", 5)
                    .style("opacity", 1);
            })
            .on("mouseout", function () {
                d3.select(".yearLabel").text("");
                d3.selectAll("text.year")
                    .remove(); // remove the year label
                d3.selectAll("g.line path")
                    .style("stroke-width", null)
                    .style("opacity", null); // restore default opacity and stroke-width for all lines
            });
    }
</script>

</body>
</html>
