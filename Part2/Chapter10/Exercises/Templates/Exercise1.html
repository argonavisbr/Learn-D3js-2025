<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Exercise 10.1</title>
</head>
<body>
<script type="module">
    import * as d3 from "https://cdn.jsdelivr.net/npm/d3@7/+esm";

    // 10.1. The chart created in the template file contains black text labels placed over graphical
    // elements of different colors. Sometimes the text is unreadable because it doesn’t contrast
    // enough with the background. Set the color for the text, considering the perceived lightness
    // of the background, so that it is readable.

    const svg = d3.select("body")
        .append("svg")
        .attr("width", 600)
        .attr("height", 200);

    // An array of colors (for the backgrounds and labels)
    const colors = // random colors
        d3.range(6).map(() => d3.interpolateRainbow(Math.random()));

    // 3x2 grid of rectangles with text labels
    svg.selectAll("g")
        .data(colors)
        .join("g")
        .attr("transform", (d, i) => `translate(${(i % 3) * 200},${Math.floor(i /3) * 100})`)
        .each(function(d) {
            const g = d3.select(this);
            g.append("rect").attr("width", 200)
                            .attr("height", 100)
                            .style("stroke", "white")
                            .style("stroke-width", 5)
                            .style("fill", d);
            g.append("text")
                .attr("x", 100)
                .attr("y", 50)
                .attr("text-align", "center")
                .attr("alignment-baseline", "central")
                .attr("text-anchor", "middle")
                .text(d)
        });

        // Use the color's lightness to decide to fill the text with black or white
        // as to have enough contrast. Use LAB color space to get the lightness of the color.
        svg.selectAll("text")
            .style("fill", d => {
                // ADD CODE HERE
            });
</script>
</body>
</html>
