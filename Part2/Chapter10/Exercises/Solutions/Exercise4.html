<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Exercise 4</title>
    <style>
        text {
            alignment-baseline: hanging;
            font-family: sans-serif;
            font-size: 10px;
        }
        text.month {
            text-anchor: middle;
        }
    </style>
</head>
<body>
<h2>Average monthly temperatures</h2>
<script type="module">
    import * as d3 from 'https://cdn.jsdelivr.net/npm/d3@7/+esm';

    // 10.4. Repeat exercise 10.3 but this time use a discrete 7-color diverging palette,
    // such as d3.schemeRbYlBu[7]. The warmer and colder months should be highlighted like
    // in the previous exercise, but you only have 7 colors to use.
    // Most of the code is the same as Exercise 3 - the differences are highlighted in comments.

    const file = '../../data/temperatures.csv';
    const h = 200, w = 800;

    const svg = d3.select("body")
        .append("svg")
        .attr("height", h)
        .attr("width", w);

    // 1) set your color scale using a 7-color diverging palette
    //    a. use a threshold scale to group values in 7 ranges
    //    b. reverse the array so that warm colors are used for higher values
    const color = d3.scaleThreshold(d3.schemeRdYlBu[7].reverse());

    d3.csv(file, d3.autoType).then(data => {
        const months = data.columns.filter(d => d !== 'city');
        const dataset = data.map(c => ({city: c.city,values: months.map(k => c[k])}));
        const values = d3.merge(dataset.map(d => d.values));

        // 2) set the domain for the color scale
        // a. compute 6 threshold values, to allow 7 ranges
        const min = d3.min(values);
        const max = d3.max(values);
        const thresholds = d3.range(min+1, max, Math.floor((max-min)/5)).concat(max+1);

        // b. set the domain here
        color.domain(thresholds);

        display(dataset);
    });

    // The rest of the code is identical to Exercise 3.
    // Displays one city per row, 12 months per city
    function display(data) {
        svg.selectAll("g")
           .data(data)
             .join("g").attr("class", "city")   // each row is a city
               .each(function(d,i) {
                   const city = d3.select(this);

                   city.append("text").attr("class", "city")    // print the name of the city
                       .text(d.city)
                       .attr("y", i*20 + 20);

                   // 3. use the color scale to fill the rectangles
                   city.selectAll("rect.month") // each rectangle is a month
                       .data(d.values)
                       .join("rect").attr("class", "month")
                       .attr("y", i*20 + 20)
                       .attr("x", (_,j) => j*45 + 100)
                       .attr("height", 20)
                       .attr("width", 40)
                       .style("fill", color); // 3

                   // 4. use the color scale to add a contrasting text value over the rectangle
                   city.selectAll("text.month")
                       .data(d.values)
                       .join("text").attr("class", "month")
                       .attr("y", i*20 + 25)
                       .attr("x", (_,j) => j*45 + 20 + 100)
                       .style("fill", c => d3.lab(color(c)).l > 60 ? 'black' : 'white') // 4
                       .text(m => m);
               })
    }

</script>
</body>
</html>
