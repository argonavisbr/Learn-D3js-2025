<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Exercise: zooming and panning a world map</title>
    <style>
        svg {
            background-color: #cceaff;
        }
        polygon {
            stroke: white;
            stroke-width: .2px;
        }
    </style>
</head>
<body>
<h3>Exercise: zooming and panning a world map</h3>
<svg id="world-map"
     width="800" height="400"
     viewBox="-200 -100 400 200"
     transform="scale(1,-1)"></svg>
<script type="module">
    import * as d3 from 'https://cdn.jsdelivr.net/npm/d3@7/+esm';

    const url = "../../data/world-lowres.geojson";  // If you moved the file, check that this URI still works
    const rand = d3.randomUniform(256);

    const data = await d3.json(url);
    const countries = data.features;

    // Fields: asciiname, latitude, longitude, population
    const cities = await d3.csv("../../data/cities10000.csv", d3.autoType);  // If you moved the file, check that this URI still works

    // EXERCISE: This file shows a world map. Implement basic zooming and panning for the map.
    // 1) Create a minimum container hierarchy (a fixed layer and a zoomable layer) for the map.
    // The zoomable layer should contain the countries.
    const svg = d3.select("#world-map");
    const context = svg.append("g").attr("class", "fixed-layer");
    const view = context.append("g").attr("class", "zoomable-layer");

    // Add the previous code to draw the countries inside the zoomable layer
   view.selectAll(".country")
       .data(countries) // many countries
         .join("g")
         .attr("class", "country")
         .style("fill", () => `rgb(${rand()},${rand()},${rand()})`)
         .selectAll("polygon")
            .data(s => s.geometry.coordinates) // many points
                .join("polygon")
                    .attr("points", d => d);

    // Add cities as circles in the zoomable layer
    view.selectAll(".city")
        .data(cities)
        .join("g")
        .each(function(d) {
            d3.select(this).append("circle")
                .attr("class", "city")
                .attr("cx", d.longitude) // Assuming x and y are the coordinates in the CSV
                .attr("cy", d.latitude)
                .attr("r", 0.5)
                .style("fill", "black");
            // if population > 10 million, add city name as text
            if (d.population > 10000000) {
                d3.select(this).append("text")
                    .attr("transform",  `translate(${d.longitude + 1}, ${d.latitude}) scale(1, -1)`) // flip text back
                    .text(d.asciiname)
                    .attr("font-size", "2px")
                    .attr("fill", "red");
            }
        });

    // 2) Configure a zooming behavior and call it from the container (svg). Implement the 'zoom' handler.
    //    Limit the zooming to 100x and limit panning to the chart area.
    const zoom = d3.zoom()
        .scaleExtent([1, 100]) // Limit zooming to 100x
        .translateExtent([[-200, -100], [200, 100]]) // Limit panning to the chart area
        .on("zoom", (event) => {
            view.attr("transform", event.transform);
        });
    svg.call(zoom);

</script>

</body>
</html>
