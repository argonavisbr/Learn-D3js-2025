<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Exercise 1 - A stratigraphic time scale of the Mesozoic era</title>
</head>
<body>
<h1>A stratigraphic time scale of the Mesozoic era</h1>
<p>Hover the mouse over a circle to see its name.</p>
<script type="module">
    // Exercise 15.2 Choose a subtree from the data used in Exercise 15.1 (e.g. use the
    // Mezozoic era object as the root) and render it with text labels. See comments labelled
    // EXERCISE below to know where to refactor the code (some refactorings are already done).

    import * as d3 from "https://cdn.jsdelivr.net/npm/d3@7/+esm";

    // 1) Get the data
    const dataFile = "../../data/geotime.json";
    const json = await d3.json(dataFile);
    console.log(json);  // Inspect the data structure to know what you can use

    // 2) Set up the SVG canvas
    const dim = { width: 1000,
                  height: 600,
                  margin: {top: 5, left: 100} }; // EXERCISE: Adjust the size and margins (done)
    const svg = d3.select("body")
                  .append("svg")
                  .attr("width", dim.width)
                  .attr("height", dim.height);

    // 3) Create a hierarchical structure from the data
    let root = d3.hierarchy(json);
    console.log(root);  // Inspect the hierarchical structure

    // EXERCISE: Choose a subtree from the data (e.g., the Mesozoic era)
    // and replace the root with that subtree. You could also use copy() to create a
    // new hierarchy from the subtree if you want to keep the original root intact.
    // Hint: look for the node with the id "Mesozoic" in the root's descendants
    // and use that node's data to create a new hierarchy.
    // ADD CODE HERE
    const mesozoicNode = root.descendants().find(d => d.data.id === "Mesozoic");
    if (mesozoicNode) {
        root = d3.hierarchy(mesozoicNode.data);  // Replace the root with the new hierarchy
    }

    // 4) Create a tree layout (EXERCISE: adjust the size to fit the new SVG dimensions - done)
    const treeLayout = d3.tree()
                         .size([dim.height - 2 * dim.margin.top, dim.width - 2 * dim.margin.left]);
    treeLayout(root);

    // 5) Draw the links (edges) - using pathlinks
    svg.selectAll('path')
       .data(root.links())
       .join('path')
       .attr('d', d3.linkHorizontal()
           .x(d => d.y + dim.margin.left) // EXERCISE: Adjust coordinates to fit the new SVG dimensions (done)
           .y(d => d.x + dim.margin.top))
       .style('fill', 'none')
       .style('stroke', '#ccc');

    // 6) Draw the nodes (EXERCISE: place them in a group, to make it easier to add labels later)
    svg.selectAll('g')
       .data(root.descendants())
         .join('g')
           .append('circle')
             .attr('cx', d => d.y + dim.margin.left) // EXERCISE: Adjust coordinates to fit the new SVG dimensions (done)
             .attr('cy', d => d.x + dim.margin.top)
             .attr('r', 5)
             .style('stroke', 'black').style('stroke-width', .5)
             .style('fill', d => d.data.color || 'black');  // Use the color from the data, default to black if not present

    // 7) EXERCISE: Add labels above each circle if it has children, or at its right if it is a leaf node
    // ADD CODE HERE
    svg.selectAll('g')
       .append('text')
            .attr('x', d => d.children ? d.y + dim.margin.left : d.y + dim.margin.left + 10)  // Adjust x position based on whether it has children
            .attr('y', d => d.x + dim.margin.top - (d.children ? 12 : 0))  // Adjust y position based on whether it has children
            .text(d => d.data.id || 'No name')  // Use the id from the data, default to 'No name' if not present
            .style('font-size', '12px')
            .style('font-family', 'arial narrow, sans-serif')
            .style('alignment-baseline', d => d.children ? 'middle' : 'central')  // Align text based on whether it has children
            .style('text-anchor', d => d.children ? 'middle' : 'start')  // Center text for nodes with children, left-align for leaf nodes
            .style('fill', d => d3.color(d.data.color).darker() || 'black');  // Set text color to black
</script>

</body>
</html>
