<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Exercise 1</title>
    <style>
        rect {
            stroke: white;
            stroke-width: 1;
        }
        text {
            font-family: 'Arial', sans-serif;
            font-size: 10px;
            alignment-baseline: hanging;
        }
    </style>
</head>
<body>
<h1>Exercise - JSON (hierarchical) version</h1>
<script type="module">
    import * as d3 from "https://cdn.jsdelivr.net/npm/d3@7/+esm";

    // Exercise 16.1 Create a partition using the data/venue.csv or data/venue.json data file,
    // using the capacity property to generate the value for each node.
    // Start with this template file, which already creates the hierarchy object for you.
    // See comments labeled EXERCISE below to know where to refactor the code (some refactorings are already done).

    // 1) Raw hierarchical data - get the data and inspect it
    const nestedFile = "../../data/venue.json"; // This solution uses the JSON file. See the other solution for the CSV file.
    const hierarchy = await d3.json(nestedFile);

    // EXERCISE: The data is in hierarchical format. We need to generate the hierarchy object from it.
    // Solution: d3.hierarchy is the best option for this file.

    // 2) EXERCISE: Generate d3.hierarchy object (generates depth, length, and methods)
    const root = d3.hierarchy(hierarchy);
    console.log("D3 hierarchy", root);

    // 3) EXERCISE: Calculate the sum of the values for each node (stored in standard value property).
    // Hint: The file contains a capacity column. Use that to create a partition proportional
    // to the capacity of each venue.
    root.sum(d => d.capacity);
    root.descendants().forEach(d => d.capacity = d.value);

    // 4) Draw the partition as an icicle chart (just call the draw function passing the root).
    draw(root);

    function draw(root) {
        // Set up the SVG and chart dimensions
        const dim = {width: 1000, height: 300};
        const margin = {top: 10, right: 10, bottom: 10, left: 10};
        const cht = {w: dim.width - margin.left - margin.right, h: dim.height - margin.top - margin.bottom};

        const chart = d3.select("body").append("svg")
            .attr("width", dim.width)
            .attr("height", dim.height)
            .style("font", "10px sans-serif")
            .append("g").attr("transform", `translate(${margin.left}, ${margin.top})`);

        // 5) EXERCISE: Create the partition layout and compute the positions of each node
        // Use the cht object for the size, which already accounts for the margins. The size is [w, h].
        d3.partition().size([cht.w, cht.h])(root);

        const nodes = root.descendants();
        const color = d3.scaleOrdinal(d3.schemeGnBu[6].slice(1).reverse());

        // 6) EXERCISE: Draw the rectangles
        chart.selectAll("rect")
            .data(nodes)
            .join("rect")
            .attr("x", d => d.x0)
            .attr("y", d => d.y0)
            .attr("width", d => d.x1 - d.x0)
            .attr("height", d => d.y1 - d.y0)
            .style("fill", d => color(d.depth));

        // EXERCISE: Add horizontal labels at top left of each node.
        chart.selectAll("text")
            .data(nodes)
            .join("text")
            .attr("x", d => d.x0 + 5)
            .attr("y", d => d.y0 + 5)
            .text(d => d.data.name)
            .style("font-size", "10px")
            .style("fill", d => d3.hsl(color(d.depth)).l > 0.5 ? "black" : "white");

        // Fit labels inside nodes if possible, otherwise rotate or remove them.
        // This code is tricky, since it needs to compute the bounding box of the text and compare it to the
        // width and height of the node. If it doesn't fit, rotate it 90 degrees. If it still doesn't fit, remove it.
        chart.selectAll("text").nodes()
            .forEach((textNode, i) => {
                const d = nodes[i];
                const width = d.x1 - d.x0, height = d.y1 - d.y0;
                const bbox = textNode.getBBox();
                if (bbox.width > width) { // doesnt fit - try to rotate
                    d3.select(textNode)
                        .attr("transform", `rotate(90, ${d.x0 + 5}, ${d.y0 + 5})`);
                    const rotatedBbox = textNode.getBBox();
                    if (rotatedBbox.width > height || rotatedBbox.width > width) {   // still doesn't fit - remove
                        d3.select(textNode).remove();
                    }
                }});
    }
</script>
</body>
</html>
