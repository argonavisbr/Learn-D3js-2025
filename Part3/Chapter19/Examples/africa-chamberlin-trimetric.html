<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Africa using the Chamberlin trimetric projection</title>
    <link rel="stylesheet" type="text/css" href="css/africa-chamberlin.css">
</head>
<body>
<script type="module">
    import * as d3_all from "https://cdn.jsdelivr.net/npm/d3@7/+esm";
    import * as d3_geo_projection from "https://cdn.skypack.dev/d3-geo-projection@4";
    const d3 = Object.assign({}, d3_all, d3_geo_projection);

    // Data files are in the data/ directory, which is one level up from the current directory
    const dataPath = "../data/africa/";
    const dataFiles = new Map([
        ["shape", dataPath + "africa.geojson"],
        ["rivers", dataPath + "africa-rivers.geojson"],
        ["cities", dataPath + "africa-1500-cities.csv"]
    ]);

    const dim = {width: 800, height: 800};
    const [countries, rivers, cities] = await Promise.all([
        d3.json(dataFiles.get("shape")),
        d3.json(dataFiles.get("rivers")),
        d3.csv(dataFiles.get("cities"), function(row) {
            return {
                city: row.city,
                coordinates: [+row.lng, +row.lat],
                population: +row.population
            };
        })
    ]);

    const filteredCities = cities.filter(d => d.population > 1000);
    const popScale = d3.scaleSqrt().range([0.1, 10]).domain([0, d3.max(filteredCities, d => d.population)]);
    const fontScale = d3.scaleSqrt().range([10,20]).domain([0, d3.max(filteredCities, d => d.population)]);
    const color = d3.scaleOrdinal(d3.schemeGreens[9]);

    const svg = d3.select("body").append("svg").attr("width", dim.width).attr("height", dim.height);

    const projection = d3.geoChamberlinAfrica()
                         .fitExtent([[0, 70], [dim.width, dim.height]], countries);
    const geoPath = d3.geoPath().projection(projection);

    const format = d3.format(".0f");

    drawGraticule(countries);
    drawCountries(countries);
    drawRivers(rivers);
    drawCities(filteredCities);

    // RENDERING FUNCTIONS
    function drawCountries(data) {
        svg.selectAll("g.country")
           .data(data.features)
              .join("g").attr("class","country")
                .style("fill", (d,i) => d3.rgb(color(i)).darker())
                .style("fill-opacity", .4)
                .append("path")
                    .attr('d', geoPath)
                    .style("stroke", "white")
    }

    function drawRivers(data) {
        svg.selectAll("g.river")
           .data(data.features)
              .join("g").attr("class","river")
                .style("fill", 'none')
                .style("opacity", 1)
                .append("path")
                   .style('stroke-width', d => d.properties.StrokeWeig)
                   .attr('d', geoPath)
                   .style("stroke", "navy");
    }

    function drawCities(data) {
        svg.selectAll("g.city")
           .data(data)
              .join("g").attr("class","city")
                .attr('transform', d => `translate(${projection(d.coordinates)})`)
                .on('mouseenter', showName)
                .on('mouseleave', hideName)
                .append("circle")
                    .style("fill", 'red')
                    .style("fill-opacity", d => popScale(d.population) <= 1 ? 1 : .25)
                    .attr('r', d => popScale(d.population))
                    .style("stroke-width", d => popScale(d.population) > 1 ? .25 : 0)
                    .style("stroke", "black");
    }

    function drawGraticule() {
        svg.append("g").attr("class","equator")
           .datum(d3.geoCircle().center([0,90]))
             .append("path")
                .attr('d', geoPath)
                .style("stroke", "gray")
                .style("fill", "none")
                .style('stroke-width', 1)
                .style('stroke-opacity', .5);

        const bounds = [[-30,-40],[60.1,40.1]];
        const graticule = d3.geoGraticule().extent(bounds);
        const meridians = graticule.lines().filter(d => d.coordinates[0][0] === d.coordinates[1][0]);
        const parallels = graticule.lines().filter(d => d.coordinates[0][1] === d.coordinates[1][1]);

        svg.append("g").attr("class","graticule")
           .datum(graticule)
              .style("fill", 'none')
                .append("path")
                .attr('d', geoPath)
                .style("stroke", "gray")
                .style('stroke-width', d => '.25');

        // graticule labels
        svg.selectAll("text.parallels")
           .data(parallels)
              .join("text").attr("class","parallels")
                .attr("transform", d => `translate(${[projection(bounds[0])[0], projection(d.coordinates[0])[1]]})`)
                .text(d => format(d.coordinates[0][1]) + '°').attr("y",2.5)

        svg.selectAll("text.meridians")
           .data(meridians)
              .join("text").attr("class","meridians")
                .attr("transform", d => `translate(${[projection(d.coordinates[0])[0], projection(bounds[1])[1]]})`)
                .text(d => format(d.coordinates[0][0]) + '°')
    }

    function showName(evt, d) {
        d3.select(this)
                .append('text')
                .style('font-size', d => fontScale(d.population))
                .text(d.city)
        d3.selectAll(".country")
                .classed("highlight", c => d3.geoContains(c, d.coordinates))
    }
    function hideName() {
        d3.select(this).select('text').remove();
        d3.selectAll(".country").classed("highlight", false);
    }
</script>

</body>
</html>
