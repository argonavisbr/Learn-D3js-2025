<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Exercise 2</title>
</head>
<body>

<script type="module">
    // EXERCISE: 2.	Render the map you created in Exercise 1 in Canvas.

    import * as d3 from "https://cdn.jsdelivr.net/npm/d3@7/+esm";
    import * as topojson from "https://cdn.jsdelivr.net/npm/topojson@3/+esm";

    // The data files
    const shapeFile = "../../data/africa/africa.topojson";
    const citiesFile = "../../data/africa/africa-cities.csv";

    // Set the dimensions and margins of the map
    const dim = { width: 800, height: 600 };

    // EXERCISE: Create the main view element - Replace the SVG code with a Canvas element and get context
    // REPLACE THE FOLLOWING CODE:
    const canvas = d3.select("body").append("canvas")
                     .attr("width", dim.width)
                     .attr("height", dim.height)
                     .node();
    const context = canvas.getContext("2d");

    // Load the data files and select relevant properties
    const [topology, cities] = await Promise.all([
        d3.json(shapeFile),
        d3.csv(citiesFile, d => ({
            city: d.asciiname,
            coordinates: [+d.longitude, +d.latitude],
            population: +d.population
        }))
    ]);

    // Convert TopoJSON to GeoJSON (the Africa object is named "africa" in the TopoJSON file)
    const geojson = topojson.feature(topology, topology.objects.africa);

    // Set up the projection
    // Use geoEqualEarth, scaled by 400, translated to 40% width and 50% height)
    // A more efficient way to scale and translate is to use fitSize (see Configuring Projections in the book)
    const projection = d3.geoEqualEarth()
                         .scale(400).translate([dim.width * .4, dim.height / 2])
                         //.fitSize([dim.width, dim.height], geojson); // not implemented here

    // EXERCISE: Set up the geopath using the projection + canvas context
    // ADD A METHOD TO THE FOLLOWING CODE:
    const geoPath = d3.geoPath().projection(projection).context(context);

    // EXERCISE: Draw a basic graticule (optional) - use a light stroke and no fill
    // REPLACE THE FOLLOWING CODE with a Canvas implementation
    const graticule = d3.geoGraticule();
    context.beginPath();
        geoPath(graticule());
        context.strokeStyle = "#ccc";
      context.stroke();

    // A color scale
    const color = d3.scaleOrdinal(d3.schemePastel1);

    // EXERCISE: Render the countries using Canvas
    // REPLACE THE FOLLOWING CODE with a Canvas implementation
    geojson.features.forEach(d => {
      context.beginPath();
           geoPath(d);
           context.fillStyle = color(d);
         context.fill();
            context.strokeStyle = "#999";
         context.stroke();
    });


    // EXERCISE: Draw labels for each country (the labels may overlap in this simple solution)
    // Use the properties.name property of each feature for the label text
    // Align with the centroid and use context.measureText to center the text
    // REPLACE THE FOLLOWING CODE with a Canvas implementation
    context.fillStyle = 'black';
    context.font = "10px Arial narrow, sans-serif";
    geojson.features.forEach(d => {
        const [x, y] = geoPath.centroid(d);
        const textWidth = context.measureText(d.properties.name).width;
        context.fillText(d.properties.name, x - textWidth / 2, y);
    });

    // Sort cities by population and take the top 20
    const majorCities = cities.sort((a, b) => b.population - a.population).slice(0, 20);

    // EXERCISE: Render the cities on the map
    // REPLACE THE FOLLOWING CODE with a Canvas implementation
    context.fillStyle = "red";
    majorCities.forEach(d => {
        const [x, y] = projection(d.coordinates);
        const radius = Math.sqrt(d.population) / 1000;
        context.beginPath();
            context.arc(x, y, radius, 0, 2 * Math.PI);
          context.fill();
            context.strokeStyle = "black";
            context.lineWidth = 0.5;
          context.stroke();
    });

    // For the canvas example, we cannot use the title attribute for hover effects.
    // You need to implement a custom tooltip using mouse events and a separate HTML element for the tooltip.

</script>
</body>
</html>
