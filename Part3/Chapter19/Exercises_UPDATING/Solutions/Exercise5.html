<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Exercise: A multi-theme choropleth - GDP</title>
    <style>
         div, h3 { text-align: center; font-family: sans-serif}
         body {
             width: 960px;
             margin: auto;
         }

        h1, h2 {
            font-family: Arial, sans-serif;
            text-align: center;
            color: #333;
        }

        p, div, li {
            font-family: Arial, sans-serif;
            font-size: 14px;
            color: #333;
        }
    </style>
</head>
<body>
<h1>Exercise: A multi-theme choropleth - GDP</h1>
<p>This choropleth displays 2 themes: GDP and GDP per capita (calculated from the country's population).
    You can choose the current theme clicking on th buttons below the map. Green is high and red is low.
</p>
<script type="module">
    import * as d3 from "https://cdn.jsdelivr.net/npm/d3@7/+esm";
    import * as topojson from "https://cdn.skypack.dev/topojson-client@3";

    // EXERCISE 5: Create a thematic map of the world comparing GDPs and GDPs per capita.
    // This is based on Thematic/2-multi-theme.html, using GDP data instead of HDI.
    // The solution uses the file data/world/un_regions_gdp.csv and the column GDP_2017 which
    // contains the GDP per capita in USD. The population is in column Pop_2016.
    // Multiply the GDP per capita by the population to get the absolute GDP in USD.

    const topojsonFile = "../../data/world/world-lowres.topojson";
    const themesFile = "../../data/world/un_regions_gdp.csv";
    const key = "world";

    // Load the data
    const [tjdata, themes] = await Promise.all([
        d3.json(topojsonFile),                      // load the TopoJSON file instead of GeoJSON
        d3.csv(themesFile, function(row) {
            // EXERCISE: Inspect the data file, select the desired columns and return an object
            // with the following properties: pop, gdp, gdpPerCapita, code. Don't forget to convert
            // the values to numbers (using the unary + operator).
            return {
                pop: +row.Pop_2016,
                gdp: +row.GDP_2017 * +row.Pop_2016,  // absolute GDP in USD, calculated from GDP per capita and population
                gdpPerCapita: +row.GDP_2017,
                code: row.Code
            }
        })
    ]);

    // Inspect the loaded data
    console.log(tjdata);   // Shape data in TopoJSON format
    console.log(themes);   // Thematic data

    const data = topojson.feature(tjdata, tjdata.objects[key]);

    // EXERCISE: Copy gdp, gdpPerCapita and pop to the properties array of each feature in the
    // shapefile (each object in data.features), matching by the country code. Create
    // new properties called gdp, pop and gdpPerCapita.
    data.features.forEach(function(d) {
        const entry = themes.filter(t => t.code === d.id)[0];
        if(entry) {
            d.properties.gdp = entry.gdp;
            d.properties.pop = entry.pop;
            d.properties.gdpPerCapita = entry.gdpPerCapita;
        }
    });

    // Set up the view
    const dim = {width: 960, height: 500};
    const svg = d3.select("body").append("svg").attr("width", dim.width).attr("height", dim.height);

    // Use the Equal Earth projection, which is a good general-purpose projection for world maps.
    // It is an equal-area projection, so it preserves the relative size of features,
    // is not conformal, so it distorts angles and shapes.
    const geoPath = d3.geoPath().projection(d3.geoEqualEarth());

    // List of themes that we support
    const themesList = [
        {label: "Population", key: "pop"},
        {label: "GDP", key: "gdp"},
        {label: "GDP per capita", key: "gdpPerCapita"}
    ];

    // Add a theme selector to the page and a callback
    addThemeSelector(themesList, applyTheme);

    // Render the map
    drawMap(svg, data, geoPath); // moved the rendering code toa a function

    // Function to apply a different theme
    function applyTheme(t) {
        let color;
        const extent = d3.extent(data.features, d => d.properties[t]);
        if (t === "gdp") { // use a different scale for absolute GDP
            color = d3.scaleSequentialPow(d3.interpolateRdYlGn).exponent(.2).domain(extent);
        } else if (t === "gdpPerCapita") { // use a different scale for GDP per capita
            color = d3.scaleSequentialPow(d3.interpolateRdYlGn).exponent(.5).domain(extent);
        } else { // population
            color = d3.scaleSequentialPow(d3.interpolateGreens).exponent(.5).domain(extent);
        }
        // update the features with the new color scale
        svg.selectAll("path.feature").style("fill", d => color(d.properties[t]));
        // update the title to show the current theme
        d3.select("h3").text(themesList.filter(d => d.key === t)[0].label);
    }

    // This function renders the map
    function drawMap(view, data, geoPath) {
        // Render the background
        view.append("path")
            .datum({type: "Sphere"})
                .attr("d", geoPath)
                .style("fill", "lightblue")
                .style("stroke", "none");

        // Render the map and apply the color scale to the fill based on population.
        view.selectAll("path.feature")
            .data(data.features)
              .join("path")
                .attr("class", "feature")
                .attr("d", geoPath)
                .style("fill", "lightslategray")
                .style("stroke-width", .5)
                .style("stroke", "blue");
    }

    // Adds ad interactive HTML interface to change the theme.
    function addThemeSelector(list, callback) {
        d3.select("body").append("div")
          .selectAll("button")
            .data(list)
              .join("button")
                .text(d => d.label)
                .on("click", (evt, d) => callback(d.key));

        d3.select("body").append("h3").lower().text("No theme");
    }

</script>

</body>
</html>
