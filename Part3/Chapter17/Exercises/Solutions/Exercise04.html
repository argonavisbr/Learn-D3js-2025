<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Migrations - A Chord Diagram</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        text {
            font-size: 12px;
            font-weight: normal;
        }
    </style>
</head>
<body>

<h1>Migrations - a chord diagram</h1>
<p>Hover the mouse over a chord for additional information.</p>
<script type="module">
    import * as d3 from "https://cdn.jsdelivr.net/npm/d3@7/+esm";
    import * as nwu from "../../js/network-utils.js"; // custom module for network utilities
    import * as highlight from "./js/chord-highlight.js"; // custom module for highlighting nodes and ribbons
    import * as gradient from "./js/chord-gradient.js";   // custom module for creating gradients for ribbons

    // This exercise creates a chord diagram. Special features such as highlighting and tooltips are already
    // implemented in the chord-highlight.js module. A gradient for the ribbons is implemented in the
    // chord-gradient.js module. Inspect the code in this file and in these modules to understand how they work.
    // Your task is to complete the parts marked as EXERCISE, which involves creating the chord layout,
    // ribbon and arc generators, and drawing the ribbons, arcs, and labels.

    const dim = {width: 800, height: 800, margin: 100};
    const radius = dim.height/2 - dim.margin/2;  // This is used to determine the radius of the chord diagram.

    const svg = d3.select("body").append("svg").attr("width", dim.width).attr("height", dim.height);
    const chart = svg.append("g")
        .attr("class", 'chart')
        .attr("transform", `translate(${[dim.width/2 + dim.margin/4, dim.height/2 + dim.margin/4]})`);

    const format = d3.format(','); // format numbers with commas (in tooltip)

    const minimum = 100000; // show only countries with at least this amount of immigrants

    // Get the data from the CSV file. The row function converts the data to a more convenient format.
    const data =
        await d3.csv("../../data/migrations_2024.csv", row => {
            const obj = {
                value: +row.Immigrants,
                target: row.Destination,
                source: row.Origin,
            }
            return obj.value > minimum ? obj : null; // filter out countries with less than minimum immigrants
        });

    const filtered = data.filter(d => d.target !== "Others" && d.source !== "Others"); // filter out items where Destination and Origin are "Others"

    // group by destination, then origin
    const groups = d3.rollups(filtered, d => d[0].value, d => d.target, d => d.source);
    const countries = [... new Set(data.map(d => d.source))];

    // compute the links array from the groups array. Each link has the following format: {source, target, value}
    const links = [];
    groups.forEach(function(item) {
        item[1].forEach(function(subItem) {
            links.push({source: item[0], target: subItem[0], value: subItem[1]});
        });
    });

    // We need the data in matrix format for the chord layout.
    // The linksToMatrix function in network-utils.js converts the links array to a matrix.
    const matrix = nwu.linksToMatrix(countries, links, true);

    // EXERCISE 4: Create the chord layout using d3.chord() and the matrix.
    // Use padAngle(.005) to add some padding between the ribbons. Sort groups and subgroups in descending order of value.
    // Inspect the result (an array of objects) in the console to understand its structure.
    const chords =
        d3.chord().padAngle(.005)
                  .sortGroups((a,b) => d3.descending(a,b))
                  .sortSubgroups((a,b) => d3.descending(a,b))(matrix);

    // EXERCISE 4: Create the ribbon generator using d3.ribbon()
    const ribbon = d3.ribbon().radius(radius);

    // EXERCISE 4: Create the arc generator using d3.arc() with inner radius = radius + 2 and outer radius = radius + 20
    const arc = d3.arc().innerRadius(radius+2).outerRadius(radius+20);

    // Setup color function and gradient for ribbons
    const color = d3.scaleSequential(d3.interpolateRainbow).domain([0,matrix.length]);
    gradient.setup(svg.append("defs"), radius, color, chords);

    // EXERCISE 4: Draw the chords (use the ribbon generator and the gradient for the fill color)
    // The data for the ribbons is in chords, which contains the start and end angles for each ribbon (migration flow)
    chart.selectAll('path.ribbon')
         .data(chords)
            .join("path").attr("class",'ribbon')
                .attr("d", ribbon)
                .style("fill", d => gradient.url(d));

    // EXERCISE 4: Draw the arcs (use the arc generator and the color function for the fill color)
    // The data for the arcs is in chords.groups, which contains the start and end angles for each group (country)
    chart.selectAll('path.arc')
         .data(chords.groups)
            .join("path").attr("class",'arc')
                .attr("d", arc)
                .style("fill", d => color(d.index));

    // EXERCISE 4: Draw the country labels (use the arc generator to position the text and the contrast function for the fill color)
    // The data for the labels is in chords.groups, which contains the start and end angles for each group (country)
    chart.selectAll("text")
         .data(chords.groups)
            .join("text")
                .attr("x", d => arc.centroid(d)[0])
                .attr("y", d => arc.centroid(d)[1])
                .text(d => d.value > 4500000 ? countries[d.index] : '')
                .style("fill", d => contrast(color(d.index)))
                .attr("transform",d => `rotate(${(arc.endAngle()(d) + arc.startAngle()(d))*90/Math.PI},${arc.centroid(d)})`);

    // Setup highlighting and tooltips (this uses js/chord-highlight.js)
    highlight.setup(chords, countries, color, minimum);

    // Luminance contrast function for text on nodes
    export function contrast(color, darker = false) {
        const c = d3.hsl(darker ? color : d3.color(color).darker());
        return c.l < .5 ? 'black' : 'white';
    }

</script>

</body>
</html>
