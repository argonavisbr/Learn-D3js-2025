<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Zooming behavior</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<script type="module">
    import * as d3 from "https://cdn.jsdelivr.net/npm/d3@7/+esm";
    import {links, nodes, chart, dim, draw, redraw} from "./js/alphabet.js";

    // EXERCISE 18.5: Use semantic zooming so that font sizes, circle radii and line widths do not change when the user zooms
    // in or out of the chart generated by Interactive/2-zoom.html. You can start with the template.
    // The template file is functionally identical to Interactive/2-zoom.html.
    // Part of the code from this app is in the file js/alphabet.js, which you may need to inspect to learn how
    // line widths are rendered.

    const offsetX = dim.margin/2 + dim.width/2;
    const offsetY = dim.margin/2 + dim.height/2;
    chart.attr("transform", `translate(${[offsetX,offsetY]})`);

    // Simulation setup
    const sim = d3.forceSimulation(nodes)
                  .force("center", d3.forceCenter())
                  .force("link", d3.forceLink(links).iterations(15))
                  .force("manybody", d3.forceManyBody().strength(-30))
                  .force("collide", d3.forceCollide(30));
    sim.on("tick", redraw);

    // Handle click events on the background (not nodes) to ADD NODES
    d3.select("svg").on('click', function(evt) {
       addNode.call(this, evt);
    });

    draw();

    // Add dragging behavior to nodes
    chart.selectAll('g.node').call(d3.drag()
        .on('drag', function(evt, d) {
            d.fx = evt.x;
            d.fy = evt.y;
        })
        .on('start', function() {
            if(sim.alpha() <= sim.alphaMin()) {
                sim.restart();
            }
            sim.alphaTarget(sim.alphaMin() + .1)
        })
        .on('end', () => sim.alphaTarget(0)));

    // Add zooming behavior to the SVG
    const zoom = d3.zoom()
        .on('zoom', function(evt) {
            semanticZoom(evt);
        });
    d3.select("svg").call(zoom);

    // EXERCISE: Implement semantic zooming so that font sizes, circle radii and line widths do not change
    // when the user zooms in or out of the chart. Hint: Inspect alphabet.js for the initial values and for how
    // line widths are rendered.
    function semanticZoom(evt) { console.log(evt)
        chart.attr("transform",
            evt.transform.translate(offsetX, offsetY));

        const k = evt.transform.k;
        chart.selectAll('g.node circle')
            .attr('r', 15 / k)              // Adjust circle radius based on zoom level
            .attr('stroke-width', 1 / k);   // Adjust border width based on zoom
        chart.selectAll('g.node text')
            .style('font-size', 12 / k);    // Adjust font size based on zoom
        chart.selectAll('line')
            .style('stroke-width', d => (d.value*d.value) / k); // Adjust line width based on zoom
    }

</script>
</body>
</html>
